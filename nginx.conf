server {
      listen 80;
      listen [::]:80;

      server_name _;
      server_tokens off;

      root /usr/share/nginx/html;
      index index.html;

      location /assets/ {
          try_files $uri =404;
          expires 1y;
          add_header Cache-Control "public, immutable";
      }

      location / {
          try_files $uri $uri/ $uri/index.html =404;
          add_header Cache-Control "no-cache";
      }

      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types
          text/css
          application/javascript
          application/json
          image/svg+xml;
  }